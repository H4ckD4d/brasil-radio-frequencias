name: Software or validation bug
description: Report a reproducible problem in RadioSync tooling or documentation.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS and Python version
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Remove credentials, private data, and licensed API responses.
      render: text
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not disclose a security vulnerability or secret.
          required: true
